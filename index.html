<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sistem Absensi Guru</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#059669">

<!-- Android / Chrome install -->
<link rel="icon" href="./icons/icon-192.png">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Absensi Guru">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f9fafb;
    overflow: hidden;
  }
  #app-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    /* aman dari notch/status bar saat standalone di iOS/Android */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    border: 0;
    display: block;
    background: #f9fafb;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f9fafb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #374151;
    transition: opacity .25s ease;
    z-index: 10;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid #d1fae5;
    border-top-color: #059669;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading span { font-size: 13px; color: #6b7280; }

  #install-btn {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border: 0;
    border-radius: 999px;
    /* Sengaja BUKAN hijau: hijau (#059669) dipakai tombol "Masuk ke Sistem" */
    background: #1d4ed8;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(29,78,216,.35);
    cursor: pointer;
    box-sizing: border-box;
  }
  #install-btn.visible { display: flex; }
  #install-btn:active { transform: scale(0.97); }

  /* Saat berhasil "menempel" tepat di bawah tombol "Masuk ke Sistem"
     (posisi & lebar dikirim dari Auth.html via postMessage) */
  #install-btn.anchored {
    right: auto;
    bottom: auto;
    border-radius: 8px;
    padding: 12px 16px;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Memuat Sistem Absensi Guru&hellip;</span>
</div>

<!-- Ganti URL di bawah jika deployment GAS Anda berganti -->
<iframe id="app-frame"
        title="Sistem Absensi Guru"
        src="https://script.google.com/macros/s/AKfycbwB1O84zB2mga8ujkKSXqrGI3UHJnsb9JZTU9wH2kz5cBQSR5BLc0W2Tb7KYSW8dcLY/exec"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="no-referrer-when-downgrade">
</iframe>

<button id="install-btn" type="button">📲 Install App</button>

<script>
  // Sembunyikan loader begitu iframe selesai load
  var frame = document.getElementById('app-frame');
  var loading = document.getElementById('loading');
  frame.addEventListener('load', function () {
    loading.classList.add('hidden');
  });
  // fallback: kalau load event tidak terpicu, tetap sembunyikan setelah 6 detik
  setTimeout(function () { loading.classList.add('hidden'); }, 6000);

  // Daftarkan service worker (syarat installability)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('SW register gagal:', err);
      });
    });
  }

  // Tombol "Install App" manual (muncul di Android Chrome & desktop Chrome/Edge
  // jika belum terinstall; tidak muncul kalau sudah berjalan sebagai app standalone)
  var deferredPrompt = null;
  var installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('visible');
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null;
      installBtn.classList.remove('visible');
    });
  });

  window.addEventListener('appinstalled', function () {
    installBtn.classList.remove('visible');
    deferredPrompt = null;
  });

  // ------------------------------------------------------------
  // Tempelkan tombol "Install App" di bawah tombol "Masuk ke
  // Sistem" (yang dirender di dalam iframe oleh Auth.html),
  // dengan lebar yang sama. Posisi & lebar tombol login dikirim
  // dari dalam iframe lewat postMessage setiap kali berubah.
  // ------------------------------------------------------------
  var lastAnchorData = null;
  var ANCHOR_GAP = 12; // jarak antara tombol login dan tombol install (px)

  function applyAnchorPosition() {
    if (!lastAnchorData || !lastAnchorData.visible || !lastAnchorData.rect) {
      // Tombol "Masuk ke Sistem" sedang tidak terlihat
      // (mis. sudah login) -> kembali ke posisi default.
      installBtn.classList.remove('anchored');
      installBtn.style.left = '';
      installBtn.style.top = '';
      installBtn.style.width = '';
      return;
    }

    var frameRect = frame.getBoundingClientRect();
    var cs = window.getComputedStyle(frame);
    var padTop = parseFloat(cs.paddingTop) || 0;
    var padLeft = parseFloat(cs.paddingLeft) || 0;

    var rect = lastAnchorData.rect;
    var left = frameRect.left + padLeft + rect.left;
    var top = frameRect.top + padTop + rect.top + rect.height + ANCHOR_GAP;

    installBtn.classList.add('anchored');
    installBtn.style.left = left + 'px';
    installBtn.style.top = top + 'px';
    installBtn.style.width = rect.width + 'px';
  }

  window.addEventListener('message', function (e) {
    var data = e.data;
    if (!data || data.type !== 'onlinekan:install-anchor') return;
    lastAnchorData = data;
    applyAnchorPosition();
  });

  // Iframe full-viewport, tapi jaga-jaga jika orientasi/ukuran
  // layar berubah, hitung ulang posisi dari data terakhir.
  window.addEventListener('resize', applyAnchorPosition);
</script>

</body>
</html>
